<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300">
<style>
  text{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}
  .cmd{fill:#e6edf3}.out{fill:#8b949e}.hi{fill:#8ea3ff;font-weight:600}.p{fill:#3fb950}
  .l{opacity:0;animation:in .4s ease forwards}
  @keyframes in{to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.l{animation:none;opacity:1}}
</style>
<rect width="560" height="300" rx="12" fill="#0d1117" stroke="#30363d"/>
<circle cx="22" cy="22" r="6" fill="#ff5f57"/><circle cx="42" cy="22" r="6" fill="#febc2e"/><circle cx="62" cy="22" r="6" fill="#28c840"/>
<text x="280" y="27" text-anchor="middle" class="out" style="font-size:12px">ajith@github: ~</text>
<text x="24" y="70" class="cmd l" style="animation-delay:0.00s"><tspan class="p">$ </tspan>whoami</text>
  <text x="24" y="94" class="out l" style="animation-delay:0.35s">ajith · backend engineer · bangalore</text>
  <text x="24" y="118" class="cmd l" style="animation-delay:0.70s"><tspan class="p">$ </tspan>gh stats --accounts personal,work</text>
  <text x="24" y="142" class="hi l" style="animation-delay:1.05s">contributions, all time     2,694</text>
  <text x="24" y="166" class="out l" style="animation-delay:1.40s">  personal                    558</text>
  <text x="24" y="190" class="out l" style="animation-delay:1.75s">  work (private repos)      2,136</text>
  <text x="24" y="214" class="hi l" style="animation-delay:2.10s">last 12 months              1,599</text>
  <text x="24" y="238" class="out l" style="animation-delay:2.45s">pull requests opened           28</text>
  <text x="24" y="262" class="out l" style="animation-delay:2.80s">public repos · stars        8 · 6</text>
  <text x="24" y="286" class="cmd l" style="animation-delay:3.15s"><tspan class="p">$ </tspan>_</text>
</svg>
