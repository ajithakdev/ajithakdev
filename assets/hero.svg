  <g class="nd" style="animation-delay:0.30s"><rect x="529" y="46" width="150" height="34" rx="8" fill="#0f141c" stroke="#222b38"/><circle cx="543" cy="63" r="3" fill="#3fb950"/><text x="555" y="67" class="nl">client</text></g>
  <g class="nd" style="animation-delay:0.42s"><rect x="739" y="46" width="150" height="34" rx="8" fill="#0f141c" stroke="#8ea3ff"/><circle cx="753" cy="63" r="3" fill="#8ea3ff"/><text x="765" y="67" class="nl">api · node.js</text></g>
  <g class="nd" style="animation-delay:0.54s"><rect x="739" y="120" width="150" height="34" rx="8" fill="#0f141c" stroke="#222b38"/><circle cx="753" cy="137" r="3" fill="#3fb950"/><text x="765" y="141" class="nl">queue · sqs</text></g>
  <g class="nd" style="animation-delay:0.66s"><rect x="529" y="120" width="150" height="34" rx="8" fill="#0f141c" stroke="#222b38"/><circle cx="543" cy="137" r="3" fill="#3fb950"/><text x="555" y="141" class="nl">worker</text></g>
  <g class="nd" style="animation-delay:0.78s"><rect x="529" y="194" width="150" height="34" rx="8" fill="#0f141c" stroke="#222b38"/><circle cx="543" cy="211" r="3" fill="#3fb950"/><text x="555" y="215" class="nl">documentdb</text></g>
  <g class="nd" style="animation-delay:0.90s"><rect x="739" y="194" width="150" height="34" rx="8" fill="#0f141c" stroke="#222b38"/><circle cx="753" cy="211" r="3" fill="#3fb950"/><text x="765" y="215" class="nl">s3</text></g>
</svg>
